name: Deploy to Dokploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 -H "x-api-key: $DOKPLOY_API_KEY" -H "Content-Type: application/json" -d '{"composeId":"XH-ieXdA-JVbEDzGY1QLP"}' https://dokployn.v3ck.com/api/compose.deploy
